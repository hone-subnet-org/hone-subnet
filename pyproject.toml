[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlvr-subnet"
version = "0.1.0"
description = "Bittensor subnet for farming RLVR (verifiable-reward) data on code tasks"
license = { file = "LICENSE" }
authors = [{ name = "subnet-5-hone contributors" }]
requires-python = ">=3.10,<3.13"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.3,<3",
    "numpy>=1.26,<3",
    "httpx>=0.27,<1",
    "rfc8785==0.1.4",
    "zstandard>=0.23,<1",
]

[project.optional-dependencies]
# Live validators dispatch over HTTP. Chain code targets the Bittensor 10.x API
# and split-out btcli, hence the pins.
chain = [
    "bittensor==10.5.0",
    "bittensor-cli==9.23.2",
]
miner = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["rlvr*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
